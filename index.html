<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Swiftword</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES --- */
        :root {
            /* DEFAULT: TTPD (Light Mode) */
            --bg-body: #ffffff;
            --bg-toolbar: #ffffff;
            --bg-grid-area: #e8e6e1;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border-color: #d1d1d1;
            
            --grid-border: #000000;
            --cell-bg: #ffffff;
            --cell-block: #000000;
            --cell-text: #000000;
            
            --highlight-active: #dbcbbd; 
            --highlight-active-text: #000000;
            --highlight-word: #f2efe9;   
            
            --btn-primary-bg: #1a1a1a;
            --btn-primary-text: #ffffff;
            
            --font-head: 'Playfair Display', serif;
            --font-body: 'Libre Franklin', sans-serif;
        }

        /* THEME: The Anthology (Dark Mode) */
        [data-theme="anthology"] {
            --bg-body: #1a1a1a; --bg-toolbar: #222222; --bg-grid-area: #121212;
            --text-main: #e0e0e0; --text-muted: #a0a0a0; --border-color: #444444;
            --grid-border: #666666; --cell-bg: #333333; --cell-block: #111111; --cell-text: #ffffff;
            --highlight-active: #5c5c5c; --highlight-word: #404040;
            --highlight-active-text: #ffffff;
            --btn-primary-bg: #ffffff; --btn-primary-text: #000000;
        }

        /* THEME: Life of a Showgirl (Orange Highlight Fix) */
        [data-theme="showgirl"] {
            --bg-body: #fdf6f0; 
            --bg-toolbar: #ffffff;
            --bg-grid-area: #faeecf; 
            --text-main: #000000;
            --border-color: #e89946; 
            --grid-border: #e89946;
            --cell-block: #000000; /* Black blocks as requested */
            
            /* Highlight matches the Resume Button (#e89946) */
            --highlight-active: #e89946; 
            --highlight-active-text: #ffffff; /* White text for contrast on orange */
            --highlight-word: #fbebdc;   
            
            --btn-primary-bg: #e89946;
            --btn-primary-text: #ffffff;
        }

        /* ERAS PALETTES */
        [data-theme="midnights"] { --highlight-active: #4b5d85; --highlight-word: #dbe4ed; --btn-primary-bg: #192a56; --highlight-active-text: #fff; }
        [data-theme="evermore"] { --highlight-active: #d9cbb8; --highlight-word: #f0eadd; --btn-primary-bg: #6e4e37; }
        [data-theme="folklore"] { --highlight-active: #cfcfcf; --highlight-word: #ebebeb; --btn-primary-bg: #555555; }
        [data-theme="lover"] { --highlight-active: #ffcce6; --highlight-word: #ffeef7; --btn-primary-bg: #e06ba8; }
        [data-theme="reputation"] { --highlight-active: #999; --highlight-word: #ccc; --btn-primary-bg: #000; --cell-block: #333; --highlight-active-text: #fff;}
        [data-theme="1989"] { --highlight-active: #b3d9ff; --highlight-word: #e6f2ff; --btn-primary-bg: #4d8ac9; }
        [data-theme="red"] { --highlight-active: #ffcccc; --highlight-word: #ffe6e6; --btn-primary-bg: #8a1c1c; }
        [data-theme="speaknow"] { --highlight-active: #dcc2e0; --highlight-word: #f3e6f5; --btn-primary-bg: #5a2e6b; }
        [data-theme="fearless"] { --highlight-active: #fceea7; --highlight-word: #fff9db; --btn-primary-bg: #a68a2d; }
        [data-theme="debut"] { --highlight-active: #b5e5c9; --highlight-word: #e0f5ea; --btn-primary-bg: #1c6b4a; }

        /* --- LAYOUT --- */
        body {
            font-family: var(--font-body); background-color: var(--bg-body); color: var(--text-main);
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s ease;
        }

        #screen-welcome {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg-body); z-index: 50; gap: 20px;
        }
        .main-logo-img { max-width: 80%; width: 400px; height: auto; margin-bottom: 10px; }
        
        .btn { padding: 14px 32px; border-radius: 50px; font-weight: 600; cursor: pointer; border: none; font-family: var(--font-body); font-size: 1.1rem; transition: transform 0.1s; }
        .btn-secondary { background: transparent; border: 2px solid var(--border-color); color: var(--text-main); font-size: 0.95rem; padding: 10px 24px; }
        .btn-primary { background-color: var(--btn-primary-bg); color: var(--btn-primary-text); }
        .btn-primary:hover, .btn-secondary:hover { transform: scale(1.05); }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; }
        [data-theme="anthology"] .modal-overlay { background: rgba(0,0,0,0.8); }
        .modal-card { background: var(--bg-toolbar); color: var(--text-main); padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); text-align: center; border: 1px solid var(--border-color); width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        
        .archive-list { list-style: none; padding: 0; margin: 20px 0; text-align: left; }
        .archive-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .archive-item:hover { background: var(--bg-grid-area); }

        /* GAME UI */
        #screen-game { display: none; flex-direction: column; height: 100%; }
        .toolbar { height: 60px; border-bottom: 1px solid var(--border-color); background: var(--bg-toolbar); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .toolbar-group { display: flex; align-items: center; gap: 15px; }
        .timer-pill { background: var(--bg-grid-area); color: var(--text-main); padding: 6px 14px; border-radius: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .tool-btn { background: none; border: none; cursor: pointer; color: var(--text-main); font-family: var(--font-body); font-weight: 600; font-size: 0.9rem; padding: 8px 10px; border-radius: 6px; }
        .tool-btn:hover { background: rgba(0,0,0,0.05); }

        .toolbar-logo { height: 32px; width: auto; cursor: pointer; transition: opacity 0.2s; }
        .toolbar-logo:hover { opacity: 0.7; }
        
        .dropdown { position: relative; }
        .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-toolbar); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); width: 200px; padding: 8px 0; margin-top: 5px; z-index: 200; max-height: 400px; overflow-y: auto; }
        .dropdown.open .dropdown-menu { display: block; }
        .dropdown-item { display: block; width: 100%; text-align: left; padding: 8px 20px; border: none; background: none; cursor: pointer; color: var(--text-main); font-family: var(--font-body); font-size: 0.9rem; }
        .dropdown-item:hover { background: var(--bg-grid-area); }
        .dropdown-divider { height: 1px; background: var(--border-color); margin: 4px 0; }
        
        /* GRID AREA */
        .game-layout { display: flex; flex: 1; overflow: hidden; }
        
        .grid-area { 
            flex: 1; background: var(--bg-grid-area); padding: 20px; 
            display: flex; justify-content: center; align-items: flex-start; overflow: auto; 
        }
        
        #crossword-grid { 
            display: grid; gap: 1px; background-color: var(--grid-border); border: 4px solid var(--grid-border); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%; max-width: 85vh; aspect-ratio: 1 / 1; margin: 0 auto;
            container-type: inline-size;
            grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
            grid-template-rows: repeat(var(--grid-rows), minmax(0, 1fr));
        }

        .cell { 
            background-color: var(--cell-bg); color: var(--cell-text); 
            position: relative; cursor: pointer; user-select: none; font-weight: 700; 
            display: flex; align-items: center; justify-content: center;
            font-size: calc((100cqw / var(--grid-cols)) * 0.6);
            overflow: hidden; 
        }
        .cell-num { position: absolute; top: 2%; left: 3%; font-size: 0.3em; color: var(--text-muted); pointer-events: none; line-height: 1; }
        .cell-text { line-height: 1; margin-top: 5%; } 

        .cell.block { background-color: var(--cell-block); cursor: default; }
        .cell.highlight-word { background-color: var(--highlight-word); }
        .cell.highlight-active { background-color: var(--highlight-active); color: var(--highlight-active-text); z-index: 2; }
        .cell.wrong { color: #d32f2f; }
        .cell.verified { color: #2e7d32; }

        .clue-sidebar { width: 420px; min-width: 300px; border-left: 1px solid var(--border-color); background: var(--bg-toolbar); display: flex; flex-direction: column; z-index: 20; }
        .clue-sticky-header { padding: 15px 20px; background: var(--bg-grid-area); border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .clue-columns-wrapper { display: flex; flex: 1; overflow: hidden; }
        .clue-column { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .clue-column:last-child { border-right: none; }
        .clue-head { padding: 12px; font-family: var(--font-head); font-weight: 700; border-bottom: 1px solid var(--border-color); text-align: center; font-size: 0.95rem; }
        .clue-list { flex: 1; overflow-y: auto; padding: 10px; }
        .clue-row { padding: 6px 10px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; margin-bottom: 4px; line-height: 1.4; }
        .clue-row:hover { background: var(--bg-grid-area); }
        .clue-row.active-clue { background: var(--highlight-active); color: var(--highlight-active-text); font-weight: 500; }

        /* --- MOBILE STYLES --- */
        @media (max-width: 768px) {
            .game-layout { flex-direction: column; }
            .grid-area { flex: none; height: auto; padding: 10px; }
            /* On mobile, grid should be responsive width but never taller than wide */
            #crossword-grid { max-width: 100%; aspect-ratio: 1/1; }
            .clue-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border-color); }
            
            /* On Mobile, sticky header is key. Hide the split lists to save space */
            .clue-columns-wrapper { display: none; } 
            
            /* Show simplified clue view on mobile? For now, we will just show the sticky header strongly */
            .clue-sticky-header { padding: 15px; font-size: 1.1rem; text-align: center; background: var(--highlight-active); color: var(--highlight-active-text); }
            
            /* Optional: You could show a single list here, but standard mobile apps focus on the sticky bar + next button */
        }
    </style>
</head>
<body data-theme="ttpd">

    <input type="text" id="mobile-input" style="position: absolute; opacity: 0; top: -1000px; left: 0; height: 0; width: 0;">

    <div id="screen-welcome">
        <img src="images/logo.png" alt="The Swiftword" class="main-logo-img">
        <button class="btn btn-primary" onclick="loadPuzzle(0)">Play Latest</button>
        <button class="btn btn-secondary" onclick="openArchiveModal()">The Archive</button>
        <p id="loading-msg" style="display:none; margin-top:10px; color:var(--text-muted);">Loading puzzle...</p>
    </div>

    <div id="modal-archive" class="modal-overlay">
        <div class="modal-card" style="text-align: left;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 class="brand-title" style="font-size: 2rem; margin:0;">The Archive</h2>
                <button class="tool-btn" onclick="document.getElementById('modal-archive').style.display='none'">✕</button>
            </div>
            <ul class="archive-list" id="archive-ul"></ul>
        </div>
    </div>

    <div id="modal-ready" class="modal-overlay">
        <div class="modal-card">
            <h2 class="brand-title" style="font-size: 2rem; margin:0 0 10px 0;">Ready?</h2>
            <p id="puzzle-meta" style="color: var(--text-muted); margin-bottom: 20px; font-weight: 600;"></p>
            <button class="btn btn-primary" onclick="startGame()">Start Puzzle</button>
        </div>
    </div>

    <div id="modal-pause" class="modal-overlay">
        <div class="modal-card">
            <h2 class="brand-title" style="font-size: 2rem; margin:0;">Paused</h2>
            <div id="pause-time" style="font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;">0:00</div>
            <button class="btn btn-primary" onclick="togglePause()">Resume</button>
        </div>
    </div>

    <div id="modal-win" class="modal-overlay">
        <div class="modal-card">
            <h2 class="brand-title" style="font-size: 2.5rem; margin-bottom: 10px;">Solved!</h2>
            <p style="font-size: 1.2rem; color: var(--text-muted);">You finished in</p>
            <div id="win-time" style="font-size: 2.5rem; font-weight: 700; margin: 10px 0 30px 0; color: var(--text-main);">0:00</div>
            <button class="btn btn-primary" onclick="document.getElementById('modal-win').style.display='none'">View Board</button>
        </div>
    </div>

    <div id="modal-tryagain" class="modal-overlay">
        <div class="modal-card">
            <h2 class="brand-title" style="font-size: 2rem; margin:0 0 10px 0;">Almost there!</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">You've filled the grid, but something isn't quite right.</p>
            <button class="btn btn-primary" onclick="document.getElementById('modal-tryagain').style.display='none'">Keep Trying</button>
        </div>
    </div>

    <div id="screen-game">
        <div class="toolbar">
            <div class="toolbar-group">
                <img src="images/textlogo.png" alt="Swiftword" class="toolbar-logo" onclick="location.reload()" title="Back to Home">
                <div class="timer-pill" id="timer">0:00</div>
                <button class="tool-btn" onclick="togglePause()" style="font-size:1.2rem; padding:0 8px;" title="Pause">⏸</button>
            </div>
            
            <div class="toolbar-group">
                <div class="dropdown" id="dropdown-theme">
                    <button class="tool-btn" onclick="toggleDropdown('dropdown-theme')">Theme ▾</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="setTheme('showgirl')">Life of a Showgirl (Orange)</button>
                        <button class="dropdown-item" onclick="setTheme('ttpd')">Tortured Poets (Light)</button>
                        <button class="dropdown-item" onclick="setTheme('anthology')">Anthology (Dark)</button>
                        <button class="dropdown-item" onclick="setTheme('midnights')">Midnights</button>
                        <button class="dropdown-item" onclick="setTheme('evermore')">Evermore</button>
                        <button class="dropdown-item" onclick="setTheme('folklore')">Folklore</button>
                        <button class="dropdown-item" onclick="setTheme('lover')">Lover</button>
                        <button class="dropdown-item" onclick="setTheme('reputation')">Reputation</button>
                        <button class="dropdown-item" onclick="setTheme('1989')">1989</button>
                        <button class="dropdown-item" onclick="setTheme('red')">Red</button>
                        <button class="dropdown-item" onclick="setTheme('speaknow')">Speak Now</button>
                        <button class="dropdown-item" onclick="setTheme('fearless')">Fearless</button>
                        <button class="dropdown-item" onclick="setTheme('debut')">Debut</button>
                    </div>
                </div>
                <div class="dropdown" id="dropdown-reveal">
                    <button class="tool-btn" onclick="toggleDropdown('dropdown-reveal')">Reveal ▾</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="revealItem('square')">Square</button>
                        <button class="dropdown-item" onclick="revealItem('word')">Word</button>
                        <button class="dropdown-item" onclick="revealItem('puzzle')">Puzzle</button>
                    </div>
                </div>
                <div class="dropdown" id="dropdown-check">
                    <button class="tool-btn" onclick="toggleDropdown('dropdown-check')">Check ▾</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="checkItem('square')">Square</button>
                        <button class="dropdown-item" onclick="checkItem('word')">Word</button>
                        <button class="dropdown-item" onclick="checkItem('puzzle')">Puzzle</button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" onclick="toggleAutocheck()" id="menu-autocheck">Autocheck: Off</button>
                    </div>
                </div>
                <div class="dropdown" id="dropdown-clear">
                    <button class="tool-btn" onclick="toggleDropdown('dropdown-clear')">Clear ▾</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="clearItem('square')">Square</button>
                        <button class="dropdown-item" onclick="clearItem('word')">Word</button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" onclick="clearItem('puzzle')" style="color:#d32f2f;">Clear Board</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="game-layout">
            <div class="grid-area">
                <div id="crossword-grid"></div>
            </div>
            <div class="clue-sidebar">
                <div class="clue-sticky-header" id="sticky-clue">Select a square to start</div>
                <div class="clue-columns-wrapper">
                    <div class="clue-column"><div class="clue-head">ACROSS</div><div class="clue-list" id="across-clues"></div></div>
                    <div class="clue-column"><div class="clue-head">DOWN</div><div class="clue-list" id="down-clues"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const PUZZLE_ARCHIVE = [
            { file: "04022026.puz", title: "Swiftword #1: Feb 4" },
            { file: "testarchive.puz", title: "Archive Test Puzzle" }
        ];
        
        // STATE
        let gameState = {
            grid: [], solution: [], clues: { across: {}, down: {} },
            width: 0, height: 0,
            currentRow: 0, currentCol: 0, direction: 'across',
            isPlaying: false, isPaused: false,
            timerInterval: null, seconds: 0, autocheck: false,
            currentPuzzleId: null, isComplete: false
        };

        // PARSER
        function parsePuz(buffer) {
            const view = new DataView(buffer);
            const decoder = new TextDecoder("ISO-8859-1");
            const width = view.getUint8(0x2C);
            const height = view.getUint8(0x2D);
            const clueCount = view.getUint16(0x2E, true);
            let offset = 0x34;
            const solutionStr = decoder.decode(buffer.slice(offset, offset + (width * height)));
            offset += (width * height) * 2; 
            const readString = () => {
                let str = "";
                while (offset < buffer.byteLength) {
                    const code = view.getUint8(offset++);
                    if (code === 0) break;
                    str += String.fromCharCode(code);
                }
                return str;
            };
            const title = readString();
            const author = readString();
            const copyright = readString();
            const rawClues = [];
            for(let i=0; i < clueCount; i++) rawClues.push(readString());
            return { width, height, solutionStr, rawClues, title, author };
        }

        function buildGridFromPuz(data) {
            const { width, height, solutionStr, rawClues } = data;
            gameState.width = width;
            gameState.height = height;
            gameState.grid = [];
            gameState.solution = [];
            gameState.clues = { across: {}, down: {} };
            let gridIndex = 0;
            for (let r = 0; r < height; r++) {
                let rowData = [], solRow = [];
                for (let c = 0; c < width; c++) {
                    const char = solutionStr[gridIndex++];
                    const isBlock = char === '.';
                    rowData.push({ letter: '', isBlock: isBlock, number: null });
                    solRow.push(isBlock ? '#' : char);
                }
                gameState.grid.push(rowData);
                gameState.solution.push(solRow);
            }
            let currentNum = 1, clueIndex = 0;
            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    if (gameState.grid[r][c].isBlock) continue;
                    let isAcross = (c === 0 || gameState.grid[r][c-1].isBlock) && (c + 1 < width && !gameState.grid[r][c+1].isBlock);
                    let isDown = (r === 0 || gameState.grid[r-1][c].isBlock) && (r + 1 < height && !gameState.grid[r+1][c].isBlock);
                    if (isAcross || isDown) {
                        gameState.grid[r][c].number = currentNum;
                        if (isAcross) gameState.clues.across[currentNum] = rawClues[clueIndex++];
                        if (isDown) gameState.clues.down[currentNum] = rawClues[clueIndex++];
                        currentNum++;
                    }
                }
            }
        }

        // LOCAL STORAGE
        function saveProgress() {
            if (!gameState.currentPuzzleId || gameState.isComplete) return;
            const saveObj = {
                grid: gameState.grid.map(row => row.map(c => c.letter)),
                seconds: gameState.seconds
            };
            localStorage.setItem('swiftword_save_' + gameState.currentPuzzleId, JSON.stringify(saveObj));
        }

        function loadProgress(puzzleId) {
            const saved = localStorage.getItem('swiftword_save_' + puzzleId);
            if (saved) {
                try {
                    const obj = JSON.parse(saved);
                    gameState.seconds = obj.seconds;
                    for(let r=0; r<gameState.height; r++){
                        for(let c=0; c<gameState.width; c++){
                            gameState.grid[r][c].letter = obj.grid[r][c] || '';
                        }
                    }
                } catch(e) { console.error("Save file corrupted", e); }
            }
        }

        function clearProgress() {
            if(gameState.currentPuzzleId) localStorage.removeItem('swiftword_save_' + gameState.currentPuzzleId);
        }

        // APP LOGIC
        async function loadPuzzle(index) {
            const item = PUZZLE_ARCHIVE[index];
            if(!item) return;
            
            gameState.currentPuzzleId = item.file;
            document.getElementById('modal-archive').style.display = 'none';
            document.getElementById('loading-msg').style.display = 'block';
            
            try {
                const response = await fetch(`puzzles/${item.file}`);
                if (!response.ok) throw new Error("Puzzle file not found");
                const buffer = await response.arrayBuffer();
                const puzData = parsePuz(buffer);
                
                buildGridFromPuz(puzData);
                
                // RESET TIME FOR NEW GAME (User Request)
                gameState.seconds = 0; 
                
                // Try Load Save (If exists, it overwrites the 0 seconds)
                loadProgress(item.file);
                
                // Title Logic (Hide "Untitled Project")
                let displayTitle = puzData.title;
                if (!displayTitle || displayTitle.includes("Untitled")) displayTitle = "The Swiftword";
                document.getElementById('puzzle-meta').innerText = `${displayTitle}\n${puzData.author}`;
                
                renderGrid(); renderClues();
                
                document.getElementById('screen-welcome').style.display = 'none';
                document.getElementById('screen-game').style.display = 'flex';
                document.getElementById('modal-ready').style.display = 'flex';
                
                document.getElementById('timer').innerText = formatTime(gameState.seconds);
                
                let r=0, c=0;
                while(r < gameState.height && gameState.grid[r][c].isBlock) {
                    c++; if(c >= gameState.width) { c=0; r++; }
                }
                moveCursor(r, c);
            } catch (e) { alert("Error: " + e.message); console.error(e); } 
            finally { document.getElementById('loading-msg').style.display = 'none'; }
        }
        
        function openArchiveModal() {
            const ul = document.getElementById('archive-ul'); ul.innerHTML = '';
            for(let i=1; i < PUZZLE_ARCHIVE.length; i++) {
                const puz = PUZZLE_ARCHIVE[i];
                const li = document.createElement('li');
                li.className = 'archive-item';
                li.innerHTML = `<span>${puz.title}</span> <span style="font-size:0.8em; color:#666">Play</span>`;
                li.onclick = () => loadPuzzle(i);
                ul.appendChild(li);
            }
            document.getElementById('modal-archive').style.display = 'flex';
        }

        function startGame() {
            document.getElementById('modal-ready').style.display = 'none';
            gameState.isPlaying = true; 
            gameState.isComplete = false;
            runTimer();
            // INIT LISTENERS
            document.addEventListener('keydown', handleInput);
            document.addEventListener('click', (e) => { if (!e.target.closest('.dropdown')) closeAllDropdowns(); });
            
            // MOBILE INPUT SETUP
            const mobileInput = document.getElementById('mobile-input');
            mobileInput.addEventListener('input', (e) => {
                const char = e.target.value.slice(-1); // Get last char typed
                if(char && char.match(/[a-zA-Z]/)) {
                    handleMobileInput(char.toUpperCase());
                }
                e.target.value = ''; // Reset input
            });
            // Handle Backspace on mobile (tricky, sometimes input event with inputType)
            mobileInput.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace') handleInput(e);
            });
        }

        function renderGrid() {
            const gridEl = document.getElementById('crossword-grid'); gridEl.innerHTML = '';
            gridEl.style.setProperty('--grid-cols', gameState.width);
            gridEl.style.setProperty('--grid-rows', gameState.height);
            gridEl.style.gridTemplateColumns = `repeat(${gameState.width}, minmax(0, 1fr))`;
            gridEl.style.gridTemplateRows = `repeat(${gameState.height}, minmax(0, 1fr))`;

            for (let r = 0; r < gameState.height; r++) {
                for (let c = 0; c < gameState.width; c++) {
                    const cellData = gameState.grid[r][c];
                    const div = document.createElement('div');
                    div.className = 'cell';
                    if (cellData.isBlock) div.classList.add('block');
                    else {
                        div.dataset.row = r; div.dataset.col = c;
                        div.innerHTML = `<span class="cell-num">${cellData.number || ''}</span><span class="cell-text">${cellData.letter}</span>`;
                        div.addEventListener('mousedown', (e) => {
                            if(gameState.isPlaying && !gameState.isPaused) { 
                                e.preventDefault(); 
                                handleCellClick(r, c); 
                            }
                        });
                        // Allow click to focus mobile input
                        div.addEventListener('click', () => {
                             if(gameState.isPlaying && !gameState.isPaused) document.getElementById('mobile-input').focus();
                        });
                    }
                    gridEl.appendChild(div);
                }
            }
        }

        function renderClues() {
            const ac = document.getElementById('across-clues'), dc = document.getElementById('down-clues');
            ac.innerHTML = ''; dc.innerHTML = '';
            const aKeys = Object.keys(gameState.clues.across).map(Number).sort((a,b)=>a-b);
            const dKeys = Object.keys(gameState.clues.down).map(Number).sort((a,b)=>a-b);
            aKeys.forEach(n => ac.innerHTML += `<div class="clue-row" id="clue-a-${n}" onclick="jumpToClue(${n}, 'across')"><strong>${n}</strong> ${gameState.clues.across[n]}</div>`);
            dKeys.forEach(n => dc.innerHTML += `<div class="clue-row" id="clue-d-${n}" onclick="jumpToClue(${n}, 'down')"><strong>${n}</strong> ${gameState.clues.down[n]}</div>`);
        }

        // INPUT & LOGIC
        function handleCellClick(r, c) {
            if (gameState.currentRow === r && gameState.currentCol === c) toggleDirection();
            else { gameState.currentRow = r; gameState.currentCol = c; }
            updateHighlights();
            document.getElementById('mobile-input').focus(); // Ensure keyboard comes up
        }

        function toggleDirection() {
            gameState.direction = gameState.direction === 'across' ? 'down' : 'across';
            updateHighlights();
        }

        function jumpToClue(num, dir) {
            for(let r=0; r<gameState.height; r++)
                for(let c=0; c<gameState.width; c++)
                    if(gameState.grid[r][c].number == num) {
                        gameState.currentRow = r; gameState.currentCol = c; gameState.direction = dir;
                        updateHighlights(); return;
                    }
        }

        function handleInput(e) {
            if (!gameState.isPlaying || gameState.isPaused) return;
            // Desktop Keydown Logic
            if (e.key === 'ArrowRight') moveSelection(0, 1);
            else if (e.key === 'ArrowLeft') moveSelection(0, -1);
            else if (e.key === 'ArrowUp') moveSelection(-1, 0);
            else if (e.key === 'ArrowDown') moveSelection(1, 0);
            else if (e.key === 'Enter') { e.preventDefault(); jumpToNextClue(); }
            else if (e.key === ' ') { e.preventDefault(); toggleDirection(); }
            else if (e.key.match(/^[a-zA-Z]$/) && e.key.length === 1) {
                e.preventDefault();
                processLetter(e.key.toUpperCase());
            } 
            else if (e.key === 'Backspace') {
                e.preventDefault();
                processBackspace();
            }
        }

        // Helper for both Desktop and Mobile Input
        function handleMobileInput(char) {
            if (!gameState.isPlaying || gameState.isPaused) return;
            processLetter(char);
        }

        function processLetter(char) {
            let r = gameState.currentRow, c = gameState.currentCol;
            updateCell(r, c, char);
            checkWinCondition();
            if (gameState.direction === 'across') jumpCursor(0, 1);
            else jumpCursor(1, 0);
            saveProgress();
        }

        function processBackspace() {
            let r = gameState.currentRow, c = gameState.currentCol;
            if (gameState.grid[r][c].letter === '') {
                 if (gameState.direction === 'across') jumpCursor(0, -1);
                 else jumpCursor(-1, 0);
            } else {
                updateCell(r, c, '');
                saveProgress();
            }
        }
        
        function updateCell(r, c, val) {
            gameState.grid[r][c].letter = val;
            getCellEl(r, c).querySelector('.cell-text').innerText = val;
            if(gameState.autocheck) checkItem('square');
            else getCellEl(r,c).classList.remove('wrong');
        }

        function checkWinCondition() {
            let isFull = true;
            let isCorrect = true;
            for(let r=0; r<gameState.height; r++){
                for(let c=0; c<gameState.width; c++){
                    if(!gameState.grid[r][c].isBlock) {
                        const letter = gameState.grid[r][c].letter;
                        if(letter === '') { isFull = false; break; }
                        if(letter !== gameState.solution[r][c]) isCorrect = false;
                    }
                }
                if(!isFull) break;
            }

            if(isFull) {
                if(isCorrect) {
                    clearInterval(gameState.timerInterval);
                    gameState.isPlaying = false;
                    gameState.isComplete = true;
                    document.getElementById('win-time').innerText = formatTime(gameState.seconds);
                    document.getElementById('modal-win').style.display = 'flex';
                    // User requested: Do NOT clear progress on win automatically
                } else {
                    document.getElementById('modal-tryagain').style.display = 'flex';
                }
            }
        }

        function moveSelection(dr, dc) {
            let nr = gameState.currentRow + dr, nc = gameState.currentCol + dc;
            if(isValidCell(nr, nc) && !gameState.grid[nr][nc].isBlock) moveCursor(nr, nc);
        }

        function jumpCursor(dr, dc) {
            let nr = gameState.currentRow + dr, nc = gameState.currentCol + dc;
            while(isValidCell(nr, nc)) {
                if(!gameState.grid[nr][nc].isBlock) { moveCursor(nr, nc); return; }
                nr += dr; nc += dc;
            }
        }

        function jumpToNextClue() {
            let startCell = getWordRange(gameState.currentRow, gameState.currentCol, gameState.direction)[0];
            let currentNum = gameState.grid[startCell.r][startCell.c].number;
            let keys = Object.keys(gameState.clues[gameState.direction]).map(Number).sort((a,b)=>a-b);
            let idx = keys.indexOf(currentNum);
            let nextNum = keys[idx + 1] || keys[0];
            if(nextNum) jumpToClue(nextNum, gameState.direction);
        }

        function isValidCell(r, c) { return r >= 0 && r < gameState.height && c >= 0 && c < gameState.width; }
        function moveCursor(r, c) { gameState.currentRow = r; gameState.currentCol = c; updateHighlights(); }

        function updateHighlights() {
            document.querySelectorAll('.cell').forEach(el => el.classList.remove('highlight-word', 'highlight-active'));
            document.querySelectorAll('.clue-row').forEach(el => el.classList.remove('active-clue'));
            const wordCells = getWordRange(gameState.currentRow, gameState.currentCol, gameState.direction);
            wordCells.forEach(pos => getCellEl(pos.r, pos.c).classList.add('highlight-word'));
            const activeEl = getCellEl(gameState.currentRow, gameState.currentCol);
            activeEl.classList.add('highlight-active');
            activeEl.scrollIntoView({behavior: "smooth", block: "nearest", inline: "center"});
            
            if(wordCells.length > 0) {
                const startCell = wordCells[0];
                const num = gameState.grid[startCell.r][startCell.c].number;
                const dirChar = gameState.direction === 'across' ? 'a' : 'd';
                const clueEl = document.getElementById(`clue-${dirChar}-${num}`);
                if(clueEl) {
                    clueEl.classList.add('active-clue');
                    clueEl.scrollIntoView({behavior: "smooth", block: "nearest"});
                    const dirText = gameState.direction === 'across' ? 'A' : 'D';
                    document.getElementById('sticky-clue').innerText = `${num}${dirText} \u00A0 ${gameState.clues[gameState.direction][num]}`;
                }
            }
        }

        function getWordRange(r, c, dir) {
            let cells = [];
            let cr = r, cc = c;
            while(true) {
                if (dir === 'across') cc--; else cr--;
                if (!isValidCell(cr, cc) || gameState.grid[cr][cc].isBlock) break;
                cells.push({r: cr, c: cc});
            }
            cells.reverse(); cells.push({r, c});
            cr = r; cc = c;
            while(true) {
                if (dir === 'across') cc++; else cr++;
                if (!isValidCell(cr, cc) || gameState.grid[cr][cc].isBlock) break;
                cells.push({r: cr, c: cc});
            }
            return cells;
        }

        function getCellEl(r, c) { return document.querySelector(`.cell[data-row='${r}'][data-col='${c}']`); }

        // TOOLS
        function togglePause() {
            if(!gameState.isPlaying) return;
            gameState.isPaused = !gameState.isPaused;
            if (gameState.isPaused) {
                clearInterval(gameState.timerInterval);
                document.getElementById('pause-time').innerText = formatTime(gameState.seconds);
                document.getElementById('modal-pause').style.display = 'flex';
                saveProgress();
            } else {
                document.getElementById('modal-pause').style.display = 'none';
                runTimer();
            }
        }
        function runTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                gameState.seconds++; 
                document.getElementById('timer').innerText = formatTime(gameState.seconds);
                if(gameState.seconds % 10 === 0) saveProgress(); 
            }, 1000);
        }
        function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }
        function toggleDropdown(id) {
            const el = document.getElementById(id);
            const wasOpen = el.classList.contains('open');
            closeAllDropdowns(); if(!wasOpen) el.classList.add('open');
        }
        function closeAllDropdowns() { document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open')); }
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); closeAllDropdowns(); }
        function toggleAutocheck() {
            gameState.autocheck = !gameState.autocheck;
            document.getElementById('menu-autocheck').innerText = `Autocheck: ${gameState.autocheck ? 'On' : 'Off'}`;
            if(gameState.autocheck) checkItem('puzzle'); closeAllDropdowns();
        }
        function checkItem(scope) {
            let list = getScopeList(scope);
            list.forEach(pos => {
                const el = getCellEl(pos.r, pos.c);
                const user = gameState.grid[pos.r][pos.c].letter;
                const corr = gameState.solution[pos.r][pos.c];
                if(user && user !== corr) el.classList.add('wrong');
                else el.classList.remove('wrong');
            }); closeAllDropdowns();
        }
        function revealItem(scope) {
            let list = getScopeList(scope);
            list.forEach(pos => {
                updateCell(pos.r, pos.c, gameState.solution[pos.r][pos.c]);
                const el = getCellEl(pos.r, pos.c);
                el.classList.add('verified'); el.classList.remove('wrong');
            });
            checkWinCondition(); 
            saveProgress();
            closeAllDropdowns();
        }
        function clearItem(scope) {
            if (scope === 'puzzle') {
                if(!confirm("Are you sure you want to clear the entire board? Your progress will be reset.")) return;
                clearProgress(); // Clear save file
            }
            let list = getScopeList(scope);
            list.forEach(pos => {
                updateCell(pos.r, pos.c, '');
                getCellEl(pos.r, pos.c).classList.remove('wrong', 'verified');
            });
            saveProgress();
            closeAllDropdowns();
        }
        function getScopeList(scope) {
            let list = [];
            if(scope === 'square') list.push({r: gameState.currentRow, c: gameState.currentCol});
            else if(scope === 'word') list = getWordRange(gameState.currentRow, gameState.currentCol, gameState.direction);
            else if(scope === 'puzzle') {
                for(let r=0; r<gameState.height; r++)
                    for(let c=0; c<gameState.width; c++)
                        if(!gameState.grid[r][c].isBlock) list.push({r, c});
            }
            return list;
        }
    </script>
